name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: 117hd-discord-bot-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Build shadow JAR
        run: |
          chmod +x gradlew
          ./gradlew shadowJar --no-daemon --stacktrace

      - name: Verify JAR output
        run: test -f build/libs/117hd-discord-bot.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: discord-bot-jar
          path: build/libs/117hd-discord-bot.jar
          retention-days: 7

      - name: Set release metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            NAME="Release ${TAG}"
          else
            DATE="$(date -u +'%Y-%m-%d')"
            BRANCH="${GITHUB_REF_NAME}"
            BRANCH_TAG="$(echo "$BRANCH" | tr '/' '-')"
            SHORT_SHA="$(git rev-parse --short HEAD)"
            TAG="${DATE}-${BRANCH_TAG}-${SHORT_SHA}"
            NAME="${DATE} - ${BRANCH}"
          fi

          FULL_SHA="$(git rev-parse HEAD)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit_url=${{ github.server_url }}/${{ github.repository }}/commit/${FULL_SHA}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: |
            117HD Discord Bot shadow JAR.

            **Commit:** [`${{ steps.meta.outputs.short_sha }}`](${{ steps.meta.outputs.commit_url }})

            ## Run
            ```bash
            java -jar 117hd-discord-bot.jar
            ```
          files: build/libs/117hd-discord-bot.jar
          generate_release_notes: false

  deploy:
    name: Deploy to server
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_DIR: /opt/117hd-discord-bot
      SERVICE_NAME: 117hd-discord-bot

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: discord-bot-jar
          path: dist

      - name: Ensure server prerequisites (JDK, deploy dir)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail

            mkdir -p "${{ env.DEPLOY_DIR }}"

            if ! command -v java >/dev/null 2>&1; then
              echo "Java not found, installing OpenJDK 11..."
              apt-get update -y
              apt-get install -y openjdk-11-jdk
            else
              echo "Java already installed: $(java -version 2>&1 | head -n1)"
            fi

      - name: Upload JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "dist/117hd-discord-bot.jar"
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 1

      - name: Write config and restart bot
        uses: appleboy/ssh-action@v1.0.3
        env:
          DISCORD_BOT_KEY: ${{ secrets.DISCORD_BOT_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DISCORD_BOT_KEY
          script: |
            set -euo pipefail

            DEPLOY_DIR="${{ env.DEPLOY_DIR }}"
            SERVICE_NAME="${{ env.SERVICE_NAME }}"
            JAR_PATH="${DEPLOY_DIR}/117hd-discord-bot.jar"

            cat > "${DEPLOY_DIR}/config.properties" <<EOF
            bot.key=${DISCORD_BOT_KEY}
            EOF
            chmod 600 "${DEPLOY_DIR}/config.properties"

            if [ ! -f "/etc/systemd/system/${SERVICE_NAME}.service" ]; then
              echo "Creating systemd service..."
              cat > "/etc/systemd/system/${SERVICE_NAME}.service" <<UNIT
            [Unit]
            Description=117HD Discord Bot
            After=network.target

            [Service]
            Type=simple
            WorkingDirectory=${DEPLOY_DIR}
            ExecStart=/usr/bin/java -jar ${JAR_PATH}
            Restart=on-failure
            RestartSec=5
            User=root

            [Install]
            WantedBy=multi-user.target
            UNIT
              systemctl daemon-reload
              systemctl enable "${SERVICE_NAME}"
            fi

            systemctl restart "${SERVICE_NAME}"
            sleep 3
            systemctl status "${SERVICE_NAME}" --no-pager
